ranking:
  query: Pharmaceutical engineering process analytical technology, formulation manufacturing quality monitoring,
    process analysis and process control. Prioritize industrial machine vision, visual inspection and
    image analysis; particle image velocimetry PIV, hyperspectral imaging, multimodal sensor fusion and
    soft sensing. Transferable computer science methods for industrial visual anomaly and defect detection,
    embodied perception and robotic control, deep learning, reinforcement learning for process control,
    self-supervised representation learning, domain adaptation, few-shot learning and time series process
    modelling.
  negative_queries:
  - erratum
  - corrigendum
  - photothermal therapy
  - drug delivery
  - clinical diagnosis
  - plant disease
  preferred_authors: []
  priority_author_boost: 0.0
  model: all-MiniLM-L6-v2
abstract_fetch:
  enabled: true
  rank_threshold: 0.1
paperqa:
  download_rank_threshold: 0.3
  rps: 0.3
  max_retries: 3
  llm: gpt-4o-mini
  summary_llm: gpt-4o-mini
  prompt: 'Evaluate pharmaceutical PAT, process control and transferable computational methods: machine
    vision, PIV, multimodal sensor fusion, embodied intelligence, deep learning and reinforcement learning.
    Return valid JSON with summary, topical_relevance and novelty_impact.'
output:
  filename: results_pharma_vision.html
  filename_ranked: results_pharma_vision_ranked.html
  filename_summary: results_pharma_vision_summary.html
  archive: true
relevance:
  publication_window_days: 180
  recency_weight: 0.1
  exclude_title_pattern: stock price|financial forecast|portfolio optimi\w*|cryptocurrency|\b(erratum|corrigendum|retraction)\b|photothermal
