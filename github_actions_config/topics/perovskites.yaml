ranking:
  query: Pharmaceutical process analytical technology and multimodal quality monitoring during formulation manufacturing.
    In-line Raman and near-infrared spectroscopy, hyperspectral imaging, machine vision, acoustic and vibration
    sensing. Sensor data fusion and chemometrics for granulation, pellet and particle size, powder blending, coating,
    drying, bubbles and foam, moisture, content uniformity and process endpoints. Transferable industrial and food
    process measurement methods.
  negative_queries:
  - erratum
  - corrigendum
  - photothermal therapy
  - drug delivery
  - clinical diagnosis
  - plant disease
  - numerical simulation of droplets
  preferred_authors: []
  priority_author_boost: 0.0
  model: all-MiniLM-L6-v2
abstract_fetch:
  enabled: true
  rank_threshold: 0.1
paperqa:
  download_rank_threshold: 0.3
  rps: 0.3
  max_retries: 3
  llm: gpt-4o-mini
  summary_llm: gpt-4o-mini
  prompt: Evaluate experimental methods for multimodal pharmaceutical process analytical technology, spectroscopy,
    machine vision, vibration/acoustic sensing and sensor fusion. Distinguish manufacturing quality monitoring from
    medical diagnosis. Return valid JSON with summary, topical_relevance and novelty_impact fields.
output:
  filename: results_pharma_vision.html
  filename_ranked: results_pharma_vision_ranked.html
  filename_summary: results_pharma_vision_summary.html
  archive: true
relevance:
