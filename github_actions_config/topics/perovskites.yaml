name: "Pharmaceutical Process Vision"
description: "药物制剂过程视觉监测、颗粒与泡沫测量，以及高温高湿环境下的可靠成像"

# 先使用原配置中已有的来源；下一步补充专业期刊
feeds:
  - "arxiv-cv"
  - "arxiv-imaging"
  - "arxiv-fluids"
  - "pharmaceutics"
  - "ij-pharmaceutics"
  - "powder-technology"
  - "nature"
  - "science"
  - "nat-chem"
  - "nat-chem-eng"
  - "pnas"
  - "science-adv"
  - "sci-rep"
  - "nat-comm"
  - "small"
  - "adv-mater"
  - "adv-sci"
  - "adv-func-mater"
  - "national-sci-rev"

# 初步筛选：覆盖直接相关研究和可借鉴的方法
filter:
  pattern: '(process analytical technolog|machine vision|visual process monitor|image.based.*monitor|in.situ.*imag|in.line.*imag|on.line.*imag|particle.*(siz|shape|morpholog|segment|track)|pellet.*(siz|shape|coat|imag|monitor)|granulat.*(imag|vision|monitor|control)|foam.*(detect|monitor|imag|control)|bubble.*(detect|segment|track|imag|measur)|antifog|anti.fog|anti.condens|optical window|condens.*(coat|optical|window|surface)|high.temperature.*(camera|imag|optical)|sensor fusion|soft sensor)'
  fields: ["title", "summary"]

# 在初筛结果中，优先排列与项目相关的论文
ranking:
  query: >
    New research methods for pharmaceutical formulation manufacturing
    and process analytical technology. Machine vision and video analysis
    for in-line process monitoring, bubbles, foam, liquid surfaces,
    pellet and particle size distributions, shape, agglomeration,
    granulation, coating thickness, process state changes and endpoint
    detection. Reliable optical imaging in hot and humid environments,
    optical window antifogging and condensation prevention.
    Transferable methods from food processing, fermentation,
    chemical engineering and materials science are also relevant.

  negative_queries:
    - "erratum"
    - "correction"
    - "reply"
    - "corrigendum"

  preferred_authors: []
  priority_author_boost: 0.0
  model: "all-MiniLM-L6-v2"

abstract_fetch:
  enabled: true
  rank_threshold: 0.2

# 保留项目要求的结构；基础网页版本稍后停用 AI 总结步骤
paperqa:
  download_rank_threshold: 0.3
  rps: 0.3
  max_retries: 3
  llm: "gpt-4o-mini"
  summary_llm: "gpt-4o-mini"

  prompt: |
    Assess this paper for pharmaceutical process monitoring,
    machine vision, particle and foam measurement, or reliable
    imaging in hot and humid environments.
    Explain the method, experimental conditions, and potential
    relevance to practical equipment.
    Distinguish demonstrated results from possible applications.
    Write the JSON values in simplified Chinese.
    Return ONLY valid JSON with this exact structure:
    {
      "summary": "核心方法及主要实验结果",
      "topical_relevance": "与研究方向 {ranking_query} 的联系及适用条件",
      "novelty_impact": "方法创新、潜在用途及局限"
    }

output:
  filename: "results_pharma_vision.html"
  filename_ranked: "results_pharma_vision_ranked.html"
  filename_summary: "results_pharma_vision_summary.html"
  archive: true
